# Publish only the playable game (page + scripts) to GitHub Pages. Docs, tests and tools stay out.
name: Deploy game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Syntax-check every script
        run: for f in *.js; do node --check "$f"; done
      - name: Run the test suite (headless Chrome)
        run: uv run --with pytest --with playwright --with pytest-rerunfailures pytest -q --reruns 1
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the game files
        run: |
          mkdir site
          cp index.html *.js site/
          # Cache busting: the page's script link and every import specifier inside the modules carry the commit,
          # so a browser can never mix old and new files (module imports don't inherit the page's query string).
          sed -i "s/\.js\"/.js?v=${GITHUB_SHA::7}\"/g" site/index.html
          sed -i -E "s#from \"\./([a-z]+)\.js\"#from \"./\1.js?v=${GITHUB_SHA::7}\"#g" site/*.js
          grep -c "?v=${GITHUB_SHA::7}" site/index.html
          test "$(grep -L "?v=${GITHUB_SHA::7}" site/*.js | grep -v globals.js)" = "" && grep -c "from \"./" site/main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
